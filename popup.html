<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Insta Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Insta Tools</h1>
  <p class="lead">History and download buttons run on instagram.com. This panel shows the video helper.</p>
  <div id="status" class="status">Checking the helper...</div>
  <dl id="details" hidden>
    <dt>yt-dlp</dt><dd id="ytdlp"></dd>
    <dt>ffmpeg</dt><dd id="ffmpeg"></dd>
    <dt>Saves to</dt><dd id="folder"></dd>
    <dt>Login from</dt><dd id="cookies"></dd>
    <dt>Settings</dt><dd id="config"></dd>
  </dl>
  <p id="hint" class="hint" hidden></p>
  <button id="retry" type="button">Check again</button>

  <h2>Recent problems</h2>
  <p class="hint">Downloads that went amber or red in this browser, newest first.</p>
  <p id="problems-empty" class="empty">None recorded.</p>
  <ol id="problems" class="problems" hidden></ol>
  <div class="actions">
    <button id="copy" type="button">Copy report</button>
    <button id="clear" type="button">Clear</button>
    <span id="copied" class="muted" aria-live="polite"></span>
  </div>
  <details id="logbox">
    <summary>Helper log</summary>
    <p id="logpath" class="hint"></p>
    <pre id="log"></pre>
  </details>
  <script src="popup.js"></script>
</body>
</html>
